title: eDNA Expeditions Phase II
description: "eDNA Expeditions Phase II"
url: "http://127.0.0.1:4000"
baseurl: ""

# Do NOT specify a theme, this disables default themes
theme:

markdown: kramdown

include:
  - assets
  - css
  - js

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

destination: _site

kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

collections:
  participating_sites:
    output: true
    permalink: /participating-sites/:name/
# Site timeline: where each site's events are fetched from. {site} = timeline_site in the page front matter.
# Currently a local mock; replace with the real endpoint, e.g. "https://.../sites/{site}/timeline".
timeline_api: "/assets/mock/timeline-{site}.json"
